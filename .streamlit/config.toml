# Tema de la app. Streamlit aplica estos colores a todos sus componentes (pestañas,
# botones, tablas, avisos...) y permite cambiar entre claro y oscuro desde el menú
# ⋮ → Settings. Los estilos propios de app.py se adaptan solos a cualquiera de los dos.

[theme]
primaryColor = "#1dbe83"

# --- Modo claro: fondo claro y barra lateral azul marino ---
[theme.light]
primaryColor = "#1dbe83"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.light.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#334155"

# --- Modo oscuro ---
[theme.dark]
primaryColor = "#1dbe83"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#172133"
textColor = "#E2E8F0"
borderColor = "#26344D"

[theme.dark.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#334155"
